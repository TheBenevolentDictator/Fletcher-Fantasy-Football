<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Analytics & Briefing Hub | FFL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Commissioner Splash Landing Overlay -->
  <section id="splash-screen" class="splash-screen">
    <div class="splash-card">
      <div class="splash-image-frame">
        <img src="commissioner.png.jpeg" alt="FFL Commissioner" class="splash-img">
      </div>
      <div class="splash-content">
        <span class="splash-kicker">Official Communiqué</span>
        <h1 class="splash-title">Welcome to the Official Site of the FFL</h1>
        <p class="splash-subtitle">Office of the Commissioner & Executive Briefings</p>
        <button id="enter-hub-btn" class="splash-btn" type="button">Enter Operations Hub ➔</button>
      </div>
    </div>
  </section>

  <!-- Main Application Container -->
  <div class="hub-container">
    <aside class="sidebar">
      <div class="brand">
        <h2>Operations Hub</h2>
        <span class="badge">Weekly Reviews</span>
      </div>
      <div class="filter-controls">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="slides">Decks</button>
        <button class="filter-btn" data-filter="chart">Data Vis</button>
      </div>
      <ul id="deck-list" class="deck-list"></ul>
      
      <!-- Public Hit Counter -->
      <div class="visit-counter">
        Visits: <span id="visit-count">...</span>
      </div>
    </aside>

    <main class="viewer-stage">
      <header class="stage-header">
        <h1 id="active-title">Loading...</h1>
        <div class="stage-actions">
          <button id="fullscreen-btn" class="action-btn" type="button">⛶ Fullscreen</button>
          <a id="open-external" href="#" target="_blank" rel="noopener">Open in New Tab ↗</a>
        </div>
      </header>
      <div class="frame-container" id="frame-container">
        <button id="fs-close-btn" class="fs-close-btn" type="button" aria-label="Exit Fullscreen">✕ Close</button>
        <iframe id="main-frame" src="" allow="fullscreen" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
