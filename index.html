<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- The primary title shown in browser tabs and fallback previews -->
  <title>Fletcher Fantasy League Site</title>

  <!-- Tags used by chat apps) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Fletcher Fantasy League">
  <meta property="og:description" content="Heatmaps and Lame Humor">
  <meta property="og:image" content="https://thebenevolentdictator.github.io/Fletcher-Fantasy-Football/commissioner.png.jpeg">

  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

  <!-- Splash Screen Overlay -->
  <section id="splash-screen">
    <div class="splash-card-inner">
      <img src="commissioner.png.jpeg" alt="FFL Commissioner">
      <div class="splash-details">
        <span class="splash-badge">A Word From the Commissioner</span>
        <h1>Hello.</h1>
        <p>Office of the Commissioner</p>
        <button id="enter-hub-btn" type="button">Enter the site ➔</button>
      </div>
    </div>
  </section>

  <!-- Main Application Container -->
  <div class="hub-container">
    <aside class="sidebar">
      <div class="brand">
        <h2>Fletcher Fantasy League</h2>
        <span class="badge">Weekly Reviews</span>
      </div>
      <div class="filter-controls">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="slides">Decks</button>
        <button class="filter-btn" data-filter="chart">Data Vis</button>
      </div>
      <ul id="deck-list" class="deck-list"></ul>
    </aside>

    <main class="viewer-stage">
      <header class="stage-header">
        <h1 id="active-title">Loading...</h1>
        <div class="stage-actions">
          <button id="fullscreen-btn" class="action-btn" type="button">⛶ Fullscreen</button>
          <a id="open-external" href="#" target="_blank" rel="noopener">Open in New Tab ↗</a>
        </div>
      </header>
      <div class="frame-container" id="frame-container">
        <button id="fs-close-btn" class="fs-close-btn" type="button" aria-label="Exit Fullscreen">✕ Close</button>
        <iframe id="main-frame" src="" allow="fullscreen" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
